# Every service starts together, with the plain commands and no flags:
#
#   docker compose up -d     postgres + api + web
#   docker compose down      stop them
#
# The API used to sit in a `backend` profile so that a bare `docker compose up`
# brought up the frontend alone. That is gone. A profiled service is invisible
# to any command that does not repeat its profile flag, which meant `down` and
# `logs` silently skipped the API unless you remembered `--profile backend` on
# both ends — a footgun that cost more than the occasional saved container.
# Run the whole stack, or name the one service you want: `docker compose up -d
# postgres`.
#
# There IS a postgres service now, reversing what this file used to say. The
# old rule — point every environment, local development included, at the
# self-hosted Postgres on the Coolify VPS — was there to stop a second database
# drifting from the real one and quietly answering queries nobody meant to
# send it. That risk is real and has not gone away; read the next paragraph as
# the standing warning it is, not as a historical note.
#
# What changed is the trade. Developing against the production database means
# every experiment, every half-written migration and every `db:seed` lands on
# live customer orders, and the VPS port is not reachable from every network
# the work happens on. So local development now runs against a container seeded
# from a full dump of production — same schema, same rows, same
# `__drizzle_migrations` state — and production is reached deliberately rather
# than by default. apps/api/.env.prod-db keeps the VPS credentials verbatim for
# when it is wanted; swapping that file back in is the whole reversal.
#
# The drift this guards against is one-directional: the local copy going stale.
# Re-dump rather than trusting a container that has been up for weeks.
#
# The VPS database does not terminate TLS on its public port, so DATABASE_SSL
# is `disable` rather than `require` — see db.service.ts, which passes the
# value straight to postgres.js and fails the connection outright if it asks
# for SSL the server will not offer. The local container does not terminate TLS
# either, so `disable` is right for both and the setting does not move.
#
# Uploads (cover images, sample PDFs) go to the self-hosted Garage cluster over
# its S3 API — the same cluster and the same bucket the academy app writes its
# lesson media into, which is why the S3_* keys in apps/api/.env are that app's
# values verbatim. Reads never come back through here: the browser fetches from
# the Cloudflare domain in front of the bucket, so the web container needs no
# storage setting and the write credential never leaves the API.
#
# Supabase is now only a legacy read: rows written before the move still carry
# Supabase Storage URLs, so apps/web/.env keeps SUPABASE_URL until they don't.
#
# Each app owns its own .env (apps/web/.env, apps/api/.env) — passed through
# verbatim via env_file rather than restated key by key under `environment:`.
# Deliberate, and not just brevity: values listed under `environment:` are
# interpolated by Compose, so any `$` in a secret is expanded before the
# container sees it. `env_file` copies values as written.
#
# That interpolation is why the connection strings now carry the password
# inline rather than assembling it from a separate DATABASE_PASSWORD var: the
# `${DATABASE_PASSWORD}` placeholder they used to hold was expanded by Compose
# and by hosting panels in their own layer, ahead of the app's substitution.
#
# There is no Redis service either. It backed the rate limiter only, and
# throttler.config.ts already falls back to in-memory storage when REDIS_URL is
# unset — per-instance limits, which is exactly right for a single dev
# container. Add it back when there is more than one API instance to share
# counters across.

services:
  # First in the file because everything else waits on it, and because it is
  # the one service also needed when the API runs on the host under
  # `npm run dev` rather than in a container: `docker compose up -d postgres`.
  postgres:
    # Pinned to the major version the VPS runs. A dump taken from 18 restores
    # into 18; restoring it into a lower major fails outright, and a higher one
    # would test the app against a server production does not run.
    image: postgres:18
    restart: unless-stopped
    ports:
      # 5433 on the host, not 5432. This machine already runs an EDB-installer
      # Postgres 18 (/Library/PostgreSQL/18/data, a system launchd daemon owned
      # by the `postgres` user) which holds 5432 and is nothing to do with this
      # project. Moving this container rather than stopping that server is the
      # reversible choice: no sudo, no risk to whatever else uses it.
      #
      # Inside the compose network the API still reaches it as postgres:5432 —
      # only the host-side mapping moves, so DATABASE_URL differs between a
      # host-run API (localhost:5433) and a containerised one (postgres:5432).
      - "5433:5432"
    environment:
      # Role, database and password match the VPS exactly. That is what lets a
      # plain `pg_dump | psql` restore carry ownership and GRANTs across
      # without --no-owner rewriting, and it keeps one DATABASE_URL shape for
      # both targets — only the host and port differ.
      POSTGRES_USER: postgres_sakura_books
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: postgres
    volumes:
      # /var/lib/postgresql, NOT the /var/lib/postgresql/data that every
      # pre-18 example shows. The 18 image puts the cluster in a versioned
      # subdirectory so `pg_upgrade --link` can work across it, and refuses to
      # start — "there appears to be PostgreSQL data in ... (unused
      # mount/volume)" — when the old path is mounted instead.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -U because the image's default user is `postgres`, which does not exist
      # here; pg_isready would report the server down while it is perfectly up.
      test: ["CMD-SHELL", "pg_isready -U postgres_sakura_books -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    # Named so a rebuilt image replaces the previous one instead of leaving it
    # dangling; untagged layers from repeated dev rebuilds are the single
    # largest consumer of disk on a long-lived box.
    image: sakura/web-dev:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: apps/web/.env
        format: raw
    environment:
      WATCHPACK_POLLING: "true"
      # Server-side fetches run inside this container, where the API's
      # localhost:4000 is not reachable — see apiOrigin() in the web app.
      API_INTERNAL_URL: http://api:4000
    volumes:
      - ./apps/web:/app/apps/web
      # Mounted so edits to the shared contracts land in the container; the dev
      # command rebuilds its dist before Next starts.
      - ./packages/contracts:/app/packages/contracts
      # Named, not anonymous. An anonymous volume is created from the image on
      # first run and then carried forward by Compose across every `up` and
      # every rebuild — so a dependency added later never appears, and the
      # container crash-loops on a module the image demonstrably contains
      # (this is what happened to pdfjs-dist). Named volumes fail the same way,
      # but they are visible in `docker volume ls` and `down -v` clears them by
      # name, which turns a mystery into a one-line fix. After changing any
      # dependency: `docker compose down -v && docker compose up --build`.
      - web_root_modules:/app/node_modules
      # The two bind mounts above shadow the container's per-workspace
      # node_modules. npm does not hoist everything — @hookform/resolvers lands
      # in apps/web/node_modules — so without these the mount hides packages the
      # install put there and Next fails to resolve them.
      - web_app_modules:/app/apps/web/node_modules
      - web_contracts_modules:/app/packages/contracts/node_modules
      - web_next_cache:/app/apps/web/.next
    # Still `required: false`, though the API is no longer profiled away: it
    # keeps `docker compose up -d web` working as a way to run the frontend by
    # itself against an API on the host, instead of dragging the whole stack up
    # with it. Ordering only — the web container starts fine without one.
    depends_on:
      api:
        condition: service_started
        required: false

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    image: sakura/api-dev:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: apps/api/.env
        format: raw
    environment:
      PORT: 4000
      # Overrides the two values env_file just supplied. apps/api/.env names
      # the database as 127.0.0.1:5433, which is correct for an API run on the
      # host and meaningless inside this container, where localhost is the
      # container itself and the published host port does not exist.
      #
      # Safe to state here despite the interpolation warning at the top of this
      # file: the local password is a plain word with no `$` for Compose to
      # expand. The VPS password has both `%` escapes and a `#`, which is
      # exactly why the production values stay in env_file.
      DATABASE_URL: postgres://postgres_sakura_books:localdev@postgres:5432/postgres
      DIRECT_DATABASE_URL: postgres://postgres_sakura_books:localdev@postgres:5432/postgres
    # Waits for the healthcheck, not just for the container to exist: Postgres
    # rejects connections for a second or two after the process starts, and the
    # API opens its pool immediately on boot.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/contracts:/app/packages/contracts
      # Named for the same reason as the web service's — see the note there.
      - api_root_modules:/app/node_modules
      - api_app_modules:/app/apps/api/node_modules
      - api_contracts_modules:/app/packages/contracts/node_modules
    healthcheck:
      # Liveness, not readiness — a Postgres blip must not mark the API
      # unhealthy. See apps/api/src/health/health.controller.ts.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

# Declared rather than left anonymous so `docker volume ls` shows what is
# holding a stale dependency tree and `docker compose down -v` can clear it.
#
# web and api keep separate module volumes on purpose. Each dev image now
# installs only its own workspace (see the --workspace flags in the two
# Dockerfile.dev files), so the two /app/node_modules trees are genuinely
# different — sharing one would give whichever service started second the
# other's dependencies.
volumes:
  # The database itself, and the one volume here that is not a disposable
  # dependency tree: `down -v` throws away the restored production copy and
  # costs another dump to get back. Everything else in this list is rebuilt by
  # an install.
  postgres_data:
  web_root_modules:
  web_app_modules:
  web_contracts_modules:
  web_next_cache:
  api_root_modules:
  api_app_modules:
  api_contracts_modules:
