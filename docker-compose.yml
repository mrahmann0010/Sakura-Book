# `docker compose up` runs the frontend alone; the API and Redis sit in the
# `backend` profile and stay stopped until asked for by name:
#
#   docker compose up                      web only  (npm run docker:up)
#   docker compose --profile backend up    web + api + redis
#
# There is no postgres service. The database is Supabase in every environment,
# including local development — so a container here would be a second database
# that drifts from the real one and quietly answers queries nobody meant to
# send it. Point DATABASE_URL at the project's Supavisor pooler; see
# apps/api/.env.example.
#
# Each app owns its own .env (apps/web/.env, apps/api/.env) — passed through
# verbatim via env_file rather than restated key by key under `environment:`.
# Deliberate, and not just brevity: values listed under `environment:` are
# interpolated by Compose, so any `$` in a secret is expanded before the
# container sees it. `env_file` copies values as written.
#
# That interpolation is why the connection strings now carry the password
# inline rather than assembling it from a separate DATABASE_PASSWORD var: the
# `${DATABASE_PASSWORD}` placeholder they used to hold was expanded by Compose
# and by hosting panels in their own layer, ahead of the app's substitution.
#
# Redis stays local: it backs the rate limiter only, holds nothing that must
# survive a restart, and is not worth a managed instance in development.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: apps/web/.env
        format: raw
    environment:
      WATCHPACK_POLLING: "true"
      # Server-side fetches run inside this container, where the API's
      # localhost:4000 is not reachable — see apiOrigin() in the web app.
      API_INTERNAL_URL: http://api:4000
    volumes:
      - ./apps/web:/app/apps/web
      # Mounted so edits to the shared contracts land in the container; turbo's
      # dev task rebuilds its dist before Next starts.
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/web/.next

  api:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "4000:4000"
    env_file:
      - path: apps/api/.env
        format: raw
    environment:
      PORT: 4000
      # Overrides the .env entry: Redis is a sibling container, not localhost.
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/api/node_modules

  redis:
    profiles: ["backend"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
