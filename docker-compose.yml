# `docker compose up` runs the frontend alone; the API sits in the
# `backend` profile and stays stopped until asked for by name:
#
#   docker compose up                      web only  (npm run docker:up)
#   docker compose --profile backend up    web + api
#
# There is no postgres service. The database is Supabase in every environment,
# including local development — so a container here would be a second database
# that drifts from the real one and quietly answers queries nobody meant to
# send it. Point DATABASE_URL at the project's Supavisor pooler; see
# apps/api/.env.example.
#
# Each app owns its own .env (apps/web/.env, apps/api/.env) — passed through
# verbatim via env_file rather than restated key by key under `environment:`.
# Deliberate, and not just brevity: values listed under `environment:` are
# interpolated by Compose, so any `$` in a secret is expanded before the
# container sees it. `env_file` copies values as written.
#
# That interpolation is why the connection strings now carry the password
# inline rather than assembling it from a separate DATABASE_PASSWORD var: the
# `${DATABASE_PASSWORD}` placeholder they used to hold was expanded by Compose
# and by hosting panels in their own layer, ahead of the app's substitution.
#
# There is no Redis service either. It backed the rate limiter only, and
# throttler.config.ts already falls back to in-memory storage when REDIS_URL is
# unset — per-instance limits, which is exactly right for a single dev
# container. Add it back when there is more than one API instance to share
# counters across.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    # Named so a rebuilt image replaces the previous one instead of leaving it
    # dangling; untagged layers from repeated dev rebuilds are the single
    # largest consumer of disk on a long-lived box.
    image: sakura/web-dev:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: apps/web/.env
        format: raw
    environment:
      WATCHPACK_POLLING: "true"
      # Server-side fetches run inside this container, where the API's
      # localhost:4000 is not reachable — see apiOrigin() in the web app.
      API_INTERNAL_URL: http://api:4000
    volumes:
      - ./apps/web:/app/apps/web
      # Mounted so edits to the shared contracts land in the container; turbo's
      # dev task rebuilds its dist before Next starts.
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/web/.next
    # Optional: only enforced when the api service is actually running, i.e.
    # under --profile backend. Plain `docker compose up` still starts web alone.
    depends_on:
      api:
        condition: service_started
        required: false

  api:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    image: sakura/api-dev:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: apps/api/.env
        format: raw
    environment:
      PORT: 4000
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/api/node_modules
    healthcheck:
      # Liveness, not readiness — a Postgres blip must not mark the API
      # unhealthy. See apps/api/src/health/health.controller.ts.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

