# `docker compose up` runs the frontend alone; the API and Redis sit in the
# `backend` profile and stay stopped until asked for by name:
#
#   docker compose up                      web only  (npm run docker:up)
#   docker compose --profile backend up    web + api + redis
#
# There is no postgres service. The database is Supabase in every environment,
# including local development — so a container here would be a second database
# that drifts from the real one and quietly answers queries nobody meant to
# send it. Point DATABASE_URL at the project's Supavisor pooler; see
# apps/api/.env.example.
#
# Each app owns its own .env (apps/web/.env, apps/api/.env) — passed through
# verbatim via env_file rather than restated key by key under `environment:`.
# Deliberate, and not just brevity for the api service: values listed under
# `environment:` are interpolated by Compose, which expands the
# `${DATABASE_PASSWORD}` inside the connection strings itself — and without
# percent-encoding, so a password containing `@` or `#` yields a broken URL in
# the container and a working one everywhere else. `env_file` copies values as
# written, leaving substitution to src/config/db-url.ts, which encodes.
#
# Redis stays local: it backs the rate limiter only, holds nothing that must
# survive a restart, and is not worth a managed instance in development.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: apps/web/.env
        format: raw
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/.next

  api:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "4000:4000"
    env_file:
      - path: apps/api/.env
        format: raw
    environment:
      PORT: 4000
      # Overrides the .env entry: Redis is a sibling container, not localhost.
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules

  redis:
    profiles: ["backend"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
