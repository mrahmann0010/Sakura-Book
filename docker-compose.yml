# The API is not built yet, so `docker compose up` runs the frontend alone.
# Everything behind it sits in the `backend` profile and stays stopped until
# asked for by name:
#
#   docker compose up                      web only  (npm run docker:up)
#   docker compose --profile backend up    web + api + postgres + redis
#
# The frontend reads no API today — apps/web/src makes no network calls and
# nothing there references NEXT_PUBLIC_API_URL. When the API lands, drop the
# `profiles` keys below and restore web's `depends_on` and API URL.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/.next

  api:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sakura}:${POSTGRES_PASSWORD:-sakura}@postgres:5432/${POSTGRES_DB:-sakura_book}
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    profiles: ["backend"]
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakura}
      POSTGRES_DB: ${POSTGRES_DB:-sakura_book}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakura}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["backend"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
